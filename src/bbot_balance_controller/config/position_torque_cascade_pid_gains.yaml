# Independent exploratory four-loop PID.
# Architecture: position -> velocity -> attitude -> angular rate -> wheel torque.
# The position target is latched once by the first stable reset_position event.

position_torque_cascade_pid_controller:
  ros__parameters:
    pid:
      position:
        kp: 0.50
        ki: 0.010
        kd: 0.30
        v_ref_limit: 0.40
        integral_limit: 2.0
      rate_limit_u: 0.0
      delta_theta_limit: 0.055
      total_torque_max: 20.0
      wheel_torque_max: 10.0
      low:
        kp_rate: 20.0
        kd_rate: 0.02
        kp_theta: 5.5
        kd_theta: 0.10
        kp_v: 0.08
        ki_v: 0.008
        kd_v: 0.001
      high:
        kp_rate: 22.0
        kd_rate: 0.025
        kp_theta: 6.0
        kd_theta: 0.12
        kp_v: 0.09
        ki_v: 0.008
        kd_v: 0.001
